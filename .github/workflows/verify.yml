name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and verify
        shell: bash
        run: ./gradlew --no-daemon clean test build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: server-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
            build/libs/blockbill-*.jar
          retention-days: 14

  client:
    name: Linux client game tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libxkbcommon0
      - name: Run the real client under a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEODRIVER: x11
          # SDL3 supports EGL on X11; do not depend on the runner's GLX visual selection.
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          mkdir -p .local
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x1024x24 +extension GLX +render -noreset' glxinfo -B | tee .local/graphics.log
          timeout --signal=QUIT --kill-after=30s 300s xvfb-run -a -s '-screen 0 1280x1024x24 +extension GLX +render -noreset' ./gradlew --no-daemon runClientGameTest --info 2>&1 | tee .local/ci-client.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: client-linux
          include-hidden-files: true
          path: |
            .local/ci-client.log
            .local/graphics.log
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/crash-reports/
          retention-days: 14
